# Nombre de la aplicación
spring.application.name=proyectoLogisticaCSL

# --- CONEXIÓN BASE DE DATOS (POSTGRESQL) ---
# CORRECCIÓN VITAL: Cambiamos 'localhost' por 'postgres-db' para que funcione en Docker
spring.datasource.url=jdbc:postgresql://postgres-db:5432/logistics_db
spring.datasource.username=postgres

# ⚠️ ¡IMPORTANTE! BORRA ESTO Y PON TU CONTRASEÑA REAL (la del docker-compose.yml)
# Si no la recuerdas, suele ser "postgres", "admin" o "root".
spring.datasource.password=tu_contraseña_postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

